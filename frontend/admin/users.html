<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users | Education For All</title>

    <link rel="stylesheet" href="../shared/css/admin.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <h2>Education For All</h2>
        </div>

        <ul>

            <li>
                <a href="dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </a>
            </li>

            <li class="active">
                <a href="users.html">
                    <i class="fa-solid fa-users"></i>
                    <span>Users</span>
                </a>
            </li>

            <li>
                <a href="resources.html">
                    <i class="fa-solid fa-book"></i>
                    <span>Resources</span>
                </a>
            </li>

            <li>
                <a href="settings.html">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>
            </li>

            <li>
                <a href="../shared/login.html">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>User Management</h1>
                <p>Manage all users registered on the platform.</p>
            </div>

            <div class="admin-profile">
                <i class="fa-solid fa-user-shield"></i>
                <span>Administrator</span>
            </div>

        </header>

        <!-- Add User -->

        <section class="activity">

            <h2>Add New User</h2>

            <form>

                <input
                    type="text"
                    placeholder="Full Name"
                    required>

                <input
                    type="email"
                    placeholder="Email Address"
                    required>

                <select required>
                    <option value="">Select Role</option>
                    <option>Student</option>
                    <option>Teacher</option>
                    <option>Translator</option>
                    <option>Administrator</option>
                </select>

                <input
                    type="password"
                    placeholder="Temporary Password"
                    required>

                <button type="submit">
                    <i class="fa-solid fa-user-plus"></i>
                    Create User
                </button>

            </form>

        </section>

        <br>

        <!-- Search -->

        <section class="activity">

            <h2>Search Users</h2>

            <input
                type="text"
                placeholder="Search by name or email">

            <br><br>

            <select>
                <option>All Roles</option>
                <option>Students</option>
                <option>Teachers</option>
                <option>Translators</option>
                <option>Administrators</option>
            </select>

        </section>

        <br>

        <!-- Users Table -->

        <section class="activity">

            <h2>Registered Users</h2>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>

                </thead>
                <tbody id="usersTableBody">
                    <!-- Users will be loaded here -->
                </tbody>

            </table>

        </section>

        <section class="activity" id="editUserSection" style="display: none;">

            <h2>Edit User</h2>

            <form id="editUserForm">

                <input
                    type="text"
                    id="editUserId"
                    readonly>

                <input
                    type="text"
                    id="editName"
                    placeholder="Full Name"
                    required>

                <input
                    type="email"
                    id="editEmail"
                    placeholder="Email Address"
                    required>

                <input
                    type="text"
                    id="editPhone"
                    placeholder="Phone Number"
                    required>

                <select id="editRole" required>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                    <option value="translator">Translator</option>
                    <option value="administrator">Administrator</option>
                </select>

                <button type="submit">
                    <i class="fa-solid fa-save"></i>
                    Save Changes
                </button>

                <button
                    type="button"
                    onclick="cancelEdit()">
                    Cancel
                </button>

            </form>

        </section>

    </main>

</div>

    <script src="js/users.js"></script>

</body>
</html>

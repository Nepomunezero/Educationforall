<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Education For All</title>

    <link rel="stylesheet" href="../shared/css/users.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <h2>Education For All</h2>
        </div>

        <ul>

            <li>
                <a href="dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    <span data-lang="dashboardTitle">Dashboard</span>
                </a>
            </li>

            <li>
                <a href="library.html">
                    <i class="fa-solid fa-book-open"></i>
                    <span data-lang="library">Library</span>
                </a>
            </li>

            <li>
                <a href="translator.html">
                    <i class="fa-solid fa-language"></i>
                    <span data-lang="translator">Translator</span>
                </a>
            </li>

            

            <li class="active">
                <a href="profile.html">
                    <i class="fa-solid fa-user"></i>
                    <span data-lang="profile">Profile</span>
                </a>
            </li>

            <li>
                <a href="../shared/login.html">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span data-lang="logout">Logout</span>
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <!-- Header -->

        <header class="topbar">

            <div>
                <h1 data-lang="profilePageTitle">My Profile</h1>
                <p data-lang="profilePageSubtitle">View and update your personal information.</p>
            </div>

            <select id="languageSwitcher">

                <option value="en">English</option>

                <option value="rw">Kinyarwanda</option>

            </select>

        </header>

        <!-- User Overview -->

        <section class="cards">

            <div class="card">
                <i class="fa-solid fa-download"></i>
                <h3 data-lang="statsDownloads">Downloads</h3>
                <p>0</p>
            </div>

            <div class="card">
                <i class="fa-solid fa-language"></i>
                <h3 data-lang="statsTranslations">Translations</h3>
                <p>0</p>
            </div>

        </section>

        <!-- Personal Information -->

        <section class="activity">

            <h2>
                <i class="fa-solid fa-user"></i>
                <span data-lang="personalInfoTitle">Personal Information</span>
            </h2>

            <form>

                <img src="../../backend/data/images/users/nepo.png"
                     alt="Profile Picture"
                     class="profile-image">

                <input
                    type="text"
                    data-lang="fullNamePlaceholder"
                    data-lang-attr="placeholder"
                    placeholder="Full Name"
                    value="Jean Nepo">

                <input
                    type="email"
                    data-lang="emailPlaceholder"
                    data-lang-attr="placeholder"
                    placeholder="Email Address"
                    value="j.munezero1@alustudent.com">

                <input
                    type="tel"
                    data-lang="phonePlaceholder"
                    data-lang-attr="placeholder"
                    placeholder="Phone Number"
                    value="+250780557082">

                <input
                    type="text"
                    data-lang="countryPlaceholder"
                    data-lang-attr="placeholder"
                    placeholder="Country"
                    value="Rwanda">

                <select>

                    <option data-lang="roleStudent">Student</option>
                    <option data-lang="roleTeacher">Teacher</option>
                    <option data-lang="roleTranslator">Translator</option>

                </select>

                <button type="submit">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span data-lang="saveChanges">Save Changes</span>
                </button>

            </form>

        </section>

        <br>

        <!-- Change Password -->

        <section class="activity">

            <h2>
                <i class="fa-solid fa-lock"></i>
                <span data-lang="changePasswordTitle">Change Password</span>
            </h2>

            <form>

                <input
                    type="password"
                    data-lang="currentPasswordPlaceholder"
                    data-lang-attr="placeholder"
                    placeholder="Current Password">

                <input
                    type="password"
                    data-lang="newPasswordPlaceholder"
                    data-lang-attr="placeholder"
                    placeholder="New Password">

                <input
                    type="password"
                    data-lang="confirmPasswordPlaceholder"
                    data-lang-attr="placeholder"
                    placeholder="Confirm New Password">

                <button type="submit">
                    <i class="fa-solid fa-key"></i>
                    <span data-lang="updatePassword">Update Password</span>
                </button>

            </form>

        </section>

    </main>

</div>

<script src="../shared/js/main.js"></script>

</body>

</html>

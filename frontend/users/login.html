<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education For All | Login</title>

    <!-- Shared CSS -->
    <link rel="stylesheet" href="shared/css/style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <h1>Education For All</h1>
            <p>Accessible Learning for Everyone</p>
        </div>

        <form id="loginForm">

            <div class="input-group">
                <label>Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <i class="fa-solid fa-eye" id="togglePassword"></i>
                </div>
            </div>

            <div class="input-group">
                <label>Login As</label>

                <select id="role" required>
                    <option value="">Select Role</option>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                    <option value="translator">Translator</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>

            <div class="remember">

                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#">Forgot Password?</a>

            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="footer-text">
            <p>
                Don't have an account?
                <a href="#">Register</a>
            </p>
        </div>

    </div>

</div>

<script src="shared/js/main.js"></script>

<script>

const togglePassword = document.getElementById("togglePassword");
const password = document.getElementById("password");

togglePassword.addEventListener("click", () => {

    if(password.type === "password"){

        password.type = "text";
        togglePassword.classList.replace("fa-eye","fa-eye-slash");

    }else{

        password.type = "password";
        togglePassword.classList.replace("fa-eye-slash","fa-eye");

    }

});

document.getElementById("loginForm").addEventListener("submit",(e)=>{

    e.preventDefault();

    const role=document.getElementById("role").value;

    if(role==="student"){
        window.location.href="users/student/dashboard.html";
    }

    else if(role==="teacher"){
        window.location.href="users/teacher/dashboard.html";
    }

    else if(role==="translator"){
        window.location.href="users/translator/dashboard.html";
    }

    else if(role==="admin"){
        window.location.href="admin/dashboard.html";
    }

    else{
        alert("Please select a role.");
    }

});

</script>

</body>
</html>

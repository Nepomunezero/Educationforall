<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translator | Education For All</title>

    <link rel="stylesheet" href="../shared/css/users.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <h2>Education For All</h2>
        </div>

        <ul>

            <li>
                <a href="dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    <span data-lang="dashboardTitle">Dashboard</span>
                </a>
            </li>

            <li>
                <a href="library.html">
                    <i class="fa-solid fa-book-open"></i>
                    <span data-lang="library">Library</span>
                </a>
            </li>

            <li class="active">
                <a href="translator.html">
                    <i class="fa-solid fa-language"></i>
                    <span data-lang="translator">Translator</span>
                </a>
            </li>

            

            <li>
                <a href="profile.html">
                    <i class="fa-solid fa-user"></i>
                    <span data-lang="profile">Profile</span>
                </a>
            </li>

            <li>
                <a href="../shared/login.html">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span data-lang="logout">Logout</span>
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <!-- Header -->

        <header class="topbar">

            <div>
                <h1 data-lang="translationWorkspaceTitle">Translation Workspace</h1>
                <p data-lang="translationWorkspaceSubtitle">Translate educational content into your preferred language.</p>
            </div>

            <select id="languageSwitcher">

                <option value="en">English</option>

                <option value="rw">Kinyarwanda</option>

            </select>

        </header>

        <!-- Translation Statistics -->

        <section class="cards">

            <div class="card">
                <i class="fa-solid fa-check-circle"></i>
                <h3 data-lang="translatorStatsCompleted">Completed</h3>
                <p>0</p>
            </div>

        </section>

        <br>

        <!-- Translation Workspace -->
        <section class="dashboard-grid">
            <!-- Source -->
            <div class="activity">
                <h2 data-lang="sourceTextTitle">Source Text</h2>
                <textarea
                    id="sourceText"
                    rows="18"
                    data-lang="sourceTextPlaceholder"
                    data-lang-attr="placeholder"
                    placeholder="Paste the text you want to translate here..."></textarea>
            </div>

            <!-- Translation -->
            <div class="activity">
                <h2 data-lang="translatedTextTitle">Translated Text</h2>
                <textarea
                    id="translatedText"
                    rows="18"
                    data-lang="translatedTextPlaceholder"
                    data-lang-attr="placeholder"
                    placeholder="Write your translation here..."></textarea>
            </div>
        </section>

        <br>

        <!-- Action Buttons -->

        <section class="quick-actions">

            <button>
                <i class="fa-solid fa-language"></i>
                <span data-lang="submit">Submit</span>
            </button>

        </section>

    </main>

</div>

<script src="../shared/js/main.js"></script>

</body>

</html>
